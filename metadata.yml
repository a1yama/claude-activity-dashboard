title: Claude Activity Dashboard
description: Claude Code の活動ログビューア
databases:
  claude_activity:
    tables:
      sessions:
        label_column: session_id
        sort_desc: last_message_at
      messages:
        sort_desc: timestamp_jst
    queries:
      daily-activity:
        title: 日別アクティビティ
        sql: |
          SELECT
            date_jst AS date,
            COUNT(DISTINCT session_id) AS sessions,
            SUM(CASE WHEN type = 'user' AND is_meta = 0 THEN 1 ELSE 0 END) AS user_messages,
            SUM(CASE WHEN type = 'assistant' THEN 1 ELSE 0 END) AS assistant_messages,
            SUM(tool_count) AS tool_uses
          FROM messages
          WHERE is_subagent = 0
          GROUP BY date_jst
          ORDER BY date_jst DESC
      overall-totals:
        title: 全期間の合計
        sql: |
          SELECT
            COUNT(*) AS total_sessions,
            SUM(user_message_count) AS total_user_messages,
            SUM(tool_use_count) AS total_tool_uses
          FROM sessions
      project-summary:
        title: プロジェクト別サマリー（直近30日）
        sql: |
          -- 累計は古いプロジェクトほど大きくなるだけで行動につながらないため直近30日で見る。
          -- 対象は「直近30日に最終更新のあったセッション」で、集計はそのセッション全体。
          -- active_minutes は ingest.py が計算した作業時間（放置を除いた時間）。
          WITH recent AS (
            SELECT * FROM sessions
            WHERE last_message_at >= datetime('now', '-30 days')
          ),
          totals AS (
            SELECT
              m.session_id,
              SUM(m.input_tokens + m.cache_creation_tokens + m.cache_read_tokens + m.output_tokens) AS tokens,
              SUM(m.error_count) AS errors
            FROM messages m
            JOIN recent r ON r.session_id = m.session_id
            GROUP BY m.session_id
          )
          SELECT
            r.project_name,
            COUNT(*) AS sessions,
            ROUND(SUM(r.active_minutes) / 60.0, 1) AS active_hours,
            SUM(t.tokens) AS tokens,
            ROUND(SUM(t.errors) * 1.0 / COUNT(*), 1) AS errors_per_session,
            MAX(r.last_message_at) AS last_used
          FROM recent r
          JOIN totals t ON t.session_id = r.session_id
          GROUP BY r.project_name
          ORDER BY active_hours DESC
      hourly-distribution:
        title: 時間帯別メッセージ分布
        sql: |
          SELECT
            hour_jst AS hour,
            COUNT(*) AS message_count,
            SUM(CASE WHEN type = 'user' AND is_meta = 0 THEN 1 ELSE 0 END) AS user_messages
          FROM messages
          WHERE is_subagent = 0
          GROUP BY hour_jst
          ORDER BY hour_jst
      tool-usage:
        title: ツール使用ランキング
        sql: |
          WITH tool_split AS (
            SELECT value AS tool_name
            FROM messages, json_each(tool_names)
            WHERE tool_names != '' AND is_subagent = 0
          )
          SELECT tool_name, COUNT(*) AS usage_count
          FROM tool_split
          WHERE tool_name != ''
          GROUP BY tool_name
          ORDER BY usage_count DESC
          LIMIT 30
      session-detail:
        title: セッション詳細
        sql: |
          SELECT
            session_id,
            project_name,
            first_message_at,
            last_message_at,
            message_count,
            user_message_count,
            assistant_message_count,
            tool_use_count,
            claude_version
          FROM sessions
          WHERE session_id = :session_id
      session-messages:
        title: セッションメッセージ一覧
        sql: |
          SELECT
            uuid,
            type,
            subtype,
            timestamp_jst,
            content_preview,
            tool_count,
            tool_names,
            tool_details,
            is_meta
          FROM messages
          WHERE session_id = :session_id AND is_subagent = 0
          ORDER BY timestamp_jst ASC
      token-usage-daily:
        title: 日別トークン使用量（サブエージェント含む）
        sql: |
          SELECT
            date_jst AS date,
            SUM(input_tokens) AS input_tokens,
            SUM(output_tokens) AS output_tokens,
            SUM(cache_creation_tokens) AS cache_creation_tokens,
            SUM(cache_read_tokens) AS cache_read_tokens
          FROM messages
          WHERE type = 'assistant'
          GROUP BY date_jst
          ORDER BY date_jst DESC
      model-usage:
        title: モデル別利用状況（サブエージェント含む）
        sql: |
          SELECT
            model,
            COUNT(DISTINCT session_id) AS sessions,
            COUNT(*) AS messages,
            SUM(input_tokens + cache_creation_tokens + cache_read_tokens) AS total_input_tokens,
            SUM(output_tokens) AS output_tokens
          FROM messages
          WHERE type = 'assistant' AND model != '' AND model NOT LIKE '<%'
          GROUP BY model
          ORDER BY output_tokens DESC
      command-usage:
        title: カスタムコマンド使用ランキング
        sql: |
          -- is_custom_command は ingest 時に判定する（ingest.py の discover_custom_commands）。
          -- /exit などのビルトインは利用傾向の示唆にならないため除外している。
          SELECT
            command_name,
            COUNT(*) AS usage_count,
            MAX(date_jst) AS last_used
          FROM messages
          WHERE command_name != ''
            AND is_subagent = 0
            AND is_custom_command = 1
          GROUP BY command_name
          ORDER BY usage_count DESC
          LIMIT 30
      friction-daily:
        title: 日別の摩擦指標（ツールエラー数）
        sql: |
          SELECT
            date_jst AS date,
            SUM(error_count) AS tool_errors,
            SUM(CASE WHEN type = 'assistant' AND stop_reason = 'refusal' THEN 1 ELSE 0 END) AS refusals
          FROM messages
          GROUP BY date_jst
          ORDER BY date_jst DESC
      improvement-proposals:
        title: 改善候補（系統B・週次自動生成）
        sql: |
          SELECT
            id,
            category,
            title,
            rationale,
            suggestion,
            target_file,
            generated_at,
            period_days,
            status,
            decided_at
          FROM improvement_proposals
          ORDER BY
            status != 'open',
            CASE category
              WHEN 'claude_md' THEN 0
              WHEN 'skill' THEN 1
              WHEN 'prompt' THEN 2
              ELSE 3
            END,
            id
      recent-sessions:
        title: 最近のセッション
        sql: |
          -- summary は最初の実質的なユーザー発話。プロジェクト名と時刻だけでは
          -- 目当てのセッションを探せないため、何をしていたかを1行で添える。
          -- 先に 50 件へ絞ってから引く（全セッションに対して評価すると桁違いに遅い）。
          WITH recent AS (
            SELECT
              session_id,
              project_name,
              first_message_at AS started,
              last_message_at AS ended,
              message_count,
              user_message_count,
              tool_use_count,
              claude_version,
              active_minutes
            FROM sessions
            ORDER BY last_message_at DESC
            LIMIT 50
          )
          SELECT
            s.session_id,
            s.project_name,
            s.started,
            s.ended,
            s.active_minutes,
            s.message_count,
            s.user_message_count,
            s.tool_use_count,
            s.claude_version,
            (
              SELECT m.content_preview
              FROM messages m
              WHERE m.session_id = s.session_id
                AND m.type = 'user'
                AND m.is_meta = 0
                AND m.is_subagent = 0
                AND m.command_name = ''
                AND m.content_preview != ''
                AND m.content_preview NOT LIKE 'This session is being continued%'
                AND m.content_preview NOT LIKE 'Caveat:%'
              ORDER BY m.timestamp
              LIMIT 1
            ) AS summary
          FROM recent s
          ORDER BY s.ended DESC
